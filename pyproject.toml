[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-red-team-kit"
version = "1.1.0"
description = "Zero-dependency LLM red-team scanner + MCP server: 24 base probes (9 categories) + 20 PRO-only (44 total), plus a deterministic offline spec audit."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "xydhw", email = "xydhw@users.noreply.gitee.com" }]
keywords = ["llm", "security", "red-team", "jailbreak", "prompt-injection", "ai-safety", "mcp", "model-context-protocol"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
llm-red-team = "redteam.cli:main"
llm-red-team-mcp = "redteam.mcp_server:main"

[project.urls]
Homepage = "https://github.com/manhliemcn4euwlu-source/llm-red-team-starter-kit"
Repository = "https://github.com/manhliemcn4euwlu-source/llm-red-team-starter-kit"
Issues = "https://github.com/manhliemcn4euwlu-source/llm-red-team-starter-kit/issues"

[tool.setuptools]
packages = ["redteam"]
