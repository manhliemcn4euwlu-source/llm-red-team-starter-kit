[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-red-team-kit"
version = "1.0.0"
description = "Zero-dependency LLM red-team scanner: 15 probes, 6 attack categories, one-command report."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "xydhw", email = "xydhw@users.noreply.gitee.com" }]
keywords = ["llm", "security", "red-team", "jailbreak", "prompt-injection", "ai-safety"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
llm-red-team = "redteam.cli:main"

[project.urls]
Homepage = "https://gitee.com/xydhw/llm-red-team-starter-kit"

[tool.setuptools]
packages = ["redteam"]
