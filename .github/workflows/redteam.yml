name: redteam-pro-gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      max_risk:
        description: "Risk score gate (0-100)"
        required: false
        default: "60"
      base_url:
        description: "OpenAI-compatible endpoint to scan"
        required: false
        default: ""

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run PRO gate
        env:
          BASE_URL: "${{ github.event.inputs.base_url || '' }}"
          API_KEY: "${{ secrets.LLM_API_KEY }}"
          MODEL: "${{ vars.LLM_MODEL || 'gpt-4o-mini' }}"
          MAX_RISK: "${{ github.event.inputs.max_risk || '60' }}"
        run: bash ci/redteam_ci.sh "$BASE_URL" "$API_KEY" "$MODEL" "$MAX_RISK" redteam-report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-pro-report
          path: redteam-report.md
